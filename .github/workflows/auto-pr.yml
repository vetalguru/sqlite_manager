name: Auto PR

# Opens a pull request into master the first time a branch is pushed, so
# every change goes through review and the required checks. Later pushes
# to the same branch just update that PR.
#
# One-time repository setting (Settings > Actions > General > Workflow
# permissions): tick "Allow GitHub Actions to create and approve pull
# requests", or the job fails with "not permitted to create ... pull
# requests".
on:
  push:
    branches-ignore: [master]

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: open-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # --fill builds the title and body from the branch's commits.
          fetch-depth: 0

      - name: Open a pull request if there is none
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open \
                       --json number --jq '.[].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open for $BRANCH"
            exit 0
          fi

          ahead=$(git rev-list --count "origin/master..HEAD")
          if [ "$ahead" -eq 0 ]; then
            echo "$BRANCH has no commits beyond master; no PR needed"
            exit 0
          fi

          gh pr create --base master --head "$BRANCH" --fill
