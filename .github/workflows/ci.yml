name: CI

# Runs on every branch push, so a branch is built and tested before it is
# merged. master is protected (changes arrive through a pull request that
# needs these checks), so the run on master is the post-merge confirmation.
on:
  push:
    branches: ['**']

# Cancel superseded runs on the same ref, but let every run on master finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-debug,   dir: build/debug }
          - { preset: linux-release, dir: build/release }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: the build derives the version from git
          # (commit count since the last release tag). A shallow clone
          # would produce a wrong PATCH.
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update &&
             sudo apt-get install -y ninja-build dpkg-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build ${{ matrix.dir }}

      - name: Test
        run: ctest --test-dir ${{ matrix.dir }} --output-on-failure

      - name: Package (.deb)
        if: matrix.preset == 'linux-release'
        run: cd ${{ matrix.dir }} && cpack -G DEB

      - name: Upload .deb
        if: matrix.preset == 'linux-release'
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-manager-deb
          path: ${{ matrix.dir }}/*.deb
          if-no-files-found: error

  gui-build:
    name: linux-gui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools and gtkmm
        run: sudo apt-get update &&
             sudo apt-get install -y ninja-build libgtkmm-4.0-dev

      - name: Configure
        run: cmake --preset linux-debug -DSQLITE_MANAGER_BUILD_GUI=ON

      - name: Build the GUI
        run: cmake --build build/debug --target sqlite-manager-gui

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools and gcovr
        run: sudo apt-get update &&
             sudo apt-get install -y ninja-build gcovr

      - name: Configure
        run: cmake --preset linux-coverage

      - name: Build
        run: cmake --build build/coverage

      - name: Coverage report
        run: cmake --build build/coverage --target coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/coverage/coverage
            build/coverage/coverage.xml
          if-no-files-found: error

  windows-wtl:
    name: windows-wtl
    # Pinned to the VS2022 image: the windows-wtl preset uses the "Visual
    # Studio 17 2022" generator, and the vendored WTL 10.0.10320 targets
    # VS2022. (windows-latest moved to VS2026 in mid-2026.) The image ships
    # VS2022 with the ATL component WTL requires, so no extra install is
    # needed.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake --preset windows-wtl

      - name: Build the WTL GUI
        run: cmake --build build/windows-wtl --target sqlite-manager-wtl --config Debug
