name: Lint

# Runs on every branch push, so a branch is built and tested before it is
# merged. master is protected (changes arrive through a pull request that
# needs these checks), so the run on master is the post-merge confirmation.
on:
  push:
    branches: ['**']

# Cancel superseded runs on the same ref, but let every run on master finish.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: configure derives the version from git.
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update &&
             sudo apt-get install -y ninja-build clang-tidy-18

      - name: Configure (generate compile_commands.json)
        run: cmake --preset linux-debug

      - name: Lint (clang-tidy; findings fail the build)
        run: cmake --build build/debug --target lint
