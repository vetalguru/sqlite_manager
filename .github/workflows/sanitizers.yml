name: Sanitizers

# Runs on every branch push, so a branch is built and tested before it is
# merged. master is protected (changes arrive through a pull request that
# needs these checks), so the run on master is the post-merge confirmation.
on:
  push:
    branches: ['**']

# Cancel superseded runs on the same ref, but let every run on master finish.
concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: the build derives the version from git.
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset linux-asan

      - name: Build
        run: cmake --build build/asan

      - name: Test (ASan + UBSan)
        run: ctest --preset linux-asan
